{% extends "base.html" %}
{% block title %}Staff Portal &middot; Meridian Logistics{% endblock %}

{% block content %}
<section class="panel" style="max-width: 380px; margin: 0 auto;">
  <h1>Staff Portal</h1>
  <p class="panel__subtitle">Internal access for Meridian Logistics staff.</p>

  <form method="post">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Username" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password">
    </div>
    <button type="submit" class="btn" style="width: 100%; justify-content: center;">Log in</button>
  </form>

  {% if error %}<p class="error-banner">{{ error }}</p>{% endif %}
</section>
{% endblock %}
