services:
  target:
    build:
      context: .
      dockerfile: target/Dockerfile
    container_name: purple-lab-target
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "5000:5000"
    networks:
      - lab-net
    depends_on:
      - wazuh.manager
    healthcheck:
      # target's entrypoint retries Wazuh agent enrollment (~50-60s observed)
      # before Flask starts serving -- retries=30 gives ~150s of post-start-
      # period headroom (failures before start_period don't count against
      # retries), comfortably above the observed startup time with margin
      # for slower CI/grading runs, not just the ~50% headroom retries=20 gave.
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    environment:
      - WAZUH_MANAGER=wazuh.manager
      # Required, externally supplied shared credential for Blue and Wazuh AR.
      # No default: target fails closed if it is absent.
      - INTERNAL_ACTION_TOKEN=${INTERNAL_ACTION_TOKEN:?set INTERNAL_ACTION_TOKEN before starting the lab}
    volumes:
      - target-logs:/app/target/logs
      - event-log:/app/shared_logs
      # Active Response with <location>local</location> executes on the
      # agent that generated the triggering event (i.e. target itself),
      # not on the manager -- confirmed empirically during Task 7 (see
      # /var/ossec/logs/active-responses.log on this container, not the
      # manager's). The custom lock-account/kill-session commands must
      # therefore be present in target's own active-response bin dir too,
      # matching the same path Wazuh's real agent binary expects.
      - ./wazuh/active-response/lock-account.sh:/var/ossec/active-response/bin/lock-account.sh
      - ./wazuh/active-response/kill-session.sh:/var/ossec/active-response/bin/kill-session.sh
      # Task 8: custom counting AR scripts -- see wazuh-rules/target_rules.xml
      # header and wazuh_manager.conf for why native frequency correlation
      # was abandoned in favor of these.
      - ./wazuh/active-response/bruteforce-guard.sh:/var/ossec/active-response/bin/bruteforce-guard.sh
      - ./wazuh/active-response/idor-guard.sh:/var/ossec/active-response/bin/idor-guard.sh

  red_agent:
    build:
      context: .
      dockerfile: red_agent/Dockerfile
    container_name: purple-lab-red
    networks:
      - lab-net
      - agent-net
    depends_on:
      target:
        condition: service_healthy
    environment:
      - TARGET_BASE_URL=http://target:5000
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      # Time (the referee's 900s round budget) is the intended kill switch,
      # not an arbitrary action count -- 300 is well above what red could
      # realistically use in 900s at its observed pace (~1 action/5-10s),
      # so the round budget binds first, not this cap.
      - RED_MAX_ITERATIONS=300
      - RED_MEMORY_PATH=/app/red_agent/memory/red_memory.json
      - EVENT_LOG_PATH=/app/shared_logs/events.jsonl
      - REFEREE_STATE_DIR=/app/referee_state
    volumes:
      - red-memory:/app/red_agent/memory
      - event-log:/app/shared_logs
      - referee-state:/app/referee_state:ro

  blue_agent:
    build:
      context: .
      dockerfile: blue_agent/Dockerfile
    container_name: purple-lab-blue
    networks:
      - lab-net
      - agent-net
    depends_on:
      - target
      - wazuh.manager
    environment:
      - TARGET_BASE_URL=http://target:5000
      - INTERNAL_ACTION_TOKEN=${INTERNAL_ACTION_TOKEN:?set INTERNAL_ACTION_TOKEN before starting the lab}
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - BLUE_MAX_ITERATIONS=200
      - BLUE_POLL_INTERVAL_SECONDS=5
      - BLUE_MEMORY_PATH=/app/blue_agent/memory/blue_memory.json
      - EVENT_LOG_PATH=/app/shared_logs/events.jsonl
      - WAZUH_ALERTS_PATH=/var/ossec/logs/alerts/alerts.json
      - REFEREE_STATE_DIR=/app/referee_state
    volumes:
      - blue-memory:/app/blue_agent/memory
      - event-log:/app/shared_logs
      # Read-only: blue only ever reads Wazuh's alert stream, never writes
      # into the manager's own log volume.
      - wazuh_logs:/var/ossec/logs:ro
      # Read-only: only the referee (Task 9) writes go.flag/stop.flag here.
      - referee-state:/app/referee_state:ro

  referee:
    build:
      context: .
      dockerfile: referee/Dockerfile
    container_name: purple-lab-referee
    # Deliberately no `networks:` entry -- the referee never makes an HTTP
    # call to anything. It only reads the shared event log and writes flag
    # files/its own assessment log, all via volumes. This is the strongest
    # form of "no direct kill capability over either agent" from the
    # design spec §5 -- it isn't merely disciplined not to call red/blue,
    # it has no route to reach them at all.
    environment:
      - EVENT_LOG_PATH=/app/shared_logs/events.jsonl
      - REFEREE_LOG_PATH=/app/referee_logs/referee_assessments.jsonl
      - REFEREE_STATE_DIR=/app/referee_state
      - REFEREE_MAX_ROUND_SECONDS=900
      - REFEREE_BLUE_STALE_SECONDS=90
      - REFEREE_BLUE_WIN_STREAK=3
      - REFEREE_POLL_INTERVAL_SECONDS=3
      - WHITE_MEMORY_PATH=/app/referee_logs/white_memory.json
      - RED_MEMORY_PATH=/app/red_memory_ro/red_memory.json
    volumes:
      # Read-only -- referee reads the shared event log but its own
      # assessment log lives in a separate volume it owns exclusively.
      - event-log:/app/shared_logs:ro
      - referee-logs:/app/referee_logs
      - referee-state:/app/referee_state
      # Read-only -- white team's flag-selection logic reads red's memory
      # to avoid re-assigning a flag red has already found, but never
      # writes into it. White's own record lives in referee-logs above.
      - red-memory:/app/red_memory_ro:ro

  purple_dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: purple-lab-dashboard
    restart: unless-stopped
    # Moved off the isolated dashboard-net onto lab-net (reach target) and
    # agent-net (reach Ollama + round_helper) -- Plan 3D's whole point is
    # letting a human act, not just observe. Disclosed, deliberate change
    # to the isolation posture built in the read-only version of this
    # service.
    networks:
      - lab-net
      - agent-net
    ports:
      - "8080:8080"
    environment:
      - EVENT_LOG_PATH=/app/shared_logs/events.jsonl
      - REFEREE_LOG_PATH=/app/referee_logs/referee_assessments.jsonl
      - REFEREE_STATE_DIR=/app/referee_state
      - TARGET_BASE_URL=http://target:5000
      - INTERNAL_ACTION_TOKEN=${INTERNAL_ACTION_TOKEN:?set INTERNAL_ACTION_TOKEN before starting the lab}
      - ROUND_HELPER_URL=http://round_helper:8090
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - ADVISOR_LOG_PATH=/app/referee_logs/advisor_log.jsonl
    volumes:
      - event-log:/app/shared_logs
      - referee-logs:/app/referee_logs
      # No longer :ro -- manual round control needs to touch/clear
      # go.flag/stop.flag.
      - referee-state:/app/referee_state

  round_helper:
    build:
      context: .
      dockerfile: round_helper/Dockerfile
    container_name: purple-lab-round-helper
    networks:
      - agent-net
    volumes:
      # :ro only protects the socket *file* on this mount point -- it does
      # not narrow the Docker Engine API reachable over it (still full
      # root-equivalent). The actual scoping is app-level: app.py's
      # hardcoded ALLOWED_CONTAINERS allowlist + INTERNAL_ACTION_TOKEN auth,
      # never :ro.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - COMPOSE_PROJECT_DIR=/app
      - INTERNAL_ACTION_TOKEN=${INTERNAL_ACTION_TOKEN:?set INTERNAL_ACTION_TOKEN before starting the lab}

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.9.2
    container_name: purple-lab-wazuh-indexer
    hostname: wazuh.indexer
    restart: always
    networks:
      - lab-net
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      - ./wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ./wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml

  wazuh.manager:
    image: wazuh/wazuh-manager:4.9.2
    container_name: purple-lab-wazuh-manager
    hostname: wazuh.manager
    restart: always
    networks:
      - lab-net
    depends_on:
      - wazuh.indexer
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh-manager-config:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      # Fixed 2026-07-27: was bind-mounted directly to /var/ossec/etc/rules/target_rules.xml,
      # which makes /var/ossec/etc/ look non-empty to the image's own 0-wazuh-init script
      # (mount_permanent_data() checks "is this directory already non-empty" before deciding
      # whether to install the full default config tree from its backup). That caused the
      # manager to skip installing shared/ar.conf, decoders/, lists/, etc. on a fresh volume --
      # analysisd then crashed at boot with "Could not open file 'etc/shared/ar.conf'" and
      # nothing else in the container restarted it, killing the whole detection engine
      # silently. Routed through the image's actual overlay mechanism (WAZUH_CONFIG_MOUNT=
      # /wazuh-config-mount, same pattern already used correctly for ossec.conf above) instead:
      # this lets mount_permanent_data() install the full defaults first, then mount_files()
      # copies this file over top afterward -- confirmed via a from-scratch (`down -v`)
      # rebuild: shared/ar.conf now installs correctly, every Wazuh daemon (analysisd,
      # apid, remoted, etc.) starts and stays running, the API responds (401 unauthenticated,
      # not connection-refused), and target_rules.xml still merges into
      # /var/ossec/etc/rules/ correctly via the overlay.
      - ./wazuh-rules/target_rules.xml:/wazuh-config-mount/etc/rules/target_rules.xml
      - ./wazuh/active-response/lock-account.sh:/var/ossec/active-response/bin/lock-account.sh
      - ./wazuh/active-response/kill-session.sh:/var/ossec/active-response/bin/kill-session.sh
      - ./wazuh/active-response/bruteforce-guard.sh:/var/ossec/active-response/bin/bruteforce-guard.sh
      - ./wazuh/active-response/idor-guard.sh:/var/ossec/active-response/bin/idor-guard.sh

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.9.2
    container_name: purple-lab-wazuh-dashboard
    hostname: wazuh.dashboard
    restart: always
    networks:
      - lab-net
      - agent-net
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    ports:
      - "443:5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom

networks:
  lab-net:
    driver: bridge
    internal: true
  agent-net:
    driver: bridge
    # Deliberately NOT internal — this is how red/blue agent containers
    # reach Ollama running on the host. The target container is never
    # attached to this network; that's what preserves the egress-block
    # guarantee verified for lab-net.

volumes:
  target-logs:
  event-log:
  red-memory:
  blue-memory:
  referee-state:
  referee-logs:
  wazuh-indexer-data:
  wazuh-manager-config:
  wazuh_api_configuration:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
